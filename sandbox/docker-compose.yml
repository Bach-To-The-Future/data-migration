# The sandbox: a disposable SQL Server, the engine's Postgres control database
# and a Spark toolbox, all local.
# Settings come from sandbox/.env, which corpus/build.py creates on first run.
name: data-migration-sandbox

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:${MSSQL_IMAGE_TAG:-2022-CU27-ubuntu-22.04}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      # Server collation is fixed at first start; it also governs tempdb,
      # so temp-table string comparisons follow it.
      MSSQL_COLLATION: ${MSSQL_COLLATION:-SQL_Latin1_General_CP1_CI_AS}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?run corpus/build.py to create sandbox/.env}
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "127.0.0.1:${MSSQL_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ../corpus/public/.cache:/var/opt/mssql/backup:ro
    mem_limit: 4g
    # Healthy once it accepts logins and every database has finished recovery, so the
    # tools container never starts against a server that is still coming up.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q \"IF EXISTS (SELECT 1 FROM sys.databases WHERE state_desc <> 'ONLINE') RAISERROR('a database is not online yet', 16, 1)\""]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 60

  # The control database server: one Postgres database per engagement (ADR 0007).
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-17.6-bookworm}
    environment:
      POSTGRES_USER: migrt
      POSTGRES_PASSWORD: ${MIGRT_PG_PASSWORD:?run corpus/build.py to create sandbox/.env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrt -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Python with PySpark, Delta, .NET with ScriptDom and SqlClient, and the engine's
  # dependencies. Runs the corpus build, the difference tests and the engine, so the
  # host needs only Docker and Python.
  tools:
    build:
      context: .
      dockerfile: tools.Dockerfile
    environment:
      MSSQL_HOST: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?run corpus/build.py to create sandbox/.env}
      MIGRT_EXTRACTOR_PASSWORD: ${MIGRT_EXTRACTOR_PASSWORD:?run corpus/build.py to create sandbox/.env}
      MIGRT_CONTROL_DSN: postgresql://migrt:${MIGRT_PG_PASSWORD}@postgres:5432/postgres
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /work/engine/src
    volumes:
      - ..:/work
    working_dir: /work
    depends_on:
      sqlserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  sqlserver-data:
  postgres-data:
