# The repo's guardrail beyond the local pre-commit hook (issue #37): on plain Docker Engine,
# with no Docker Desktop, rebuild the sandbox and both corpora from scratch, check that the
# corpus manifest is byte-identical, then run the engine's lint, types and tests.
name: Sandbox and engine

on:
  # Most work lands directly on master; the repository is public, so runs are free.
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 2 * * *"      # nightly, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running check. Runs on master (each push,
# nightly, manual) are never cancelled, so every commit there gets its own result.
concurrency:
  # One group per pull request; every other run is its own group, since a shared group
  # would also drop queued runs.
  group: sandbox-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The SQL Server and toolbox images and the restored public databases need more disk
      # than the runner leaves free; these preinstalled SDKs are unused here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Docker Engine and Python
        run: |
          docker version
          docker compose version
          python3 --version

      # The sample backups (about 330 MB) are downloaded only when backups.json changes;
      # build.py checks each one against its sha256 on every use, cached or not.
      - name: Restore the sample backups
        id: backups
        uses: actions/cache/restore@v4
        with:
          path: corpus/public/.cache
          key: sample-backups-${{ hashFiles('corpus/public/backups.json') }}

      # From scratch otherwise: a fresh runner has no data volumes and no sandbox/.env, so
      # this generates secrets, downloads any backup not cached and checks them all, builds the
      # toolbox image (with the .NET libraries and pyright), restores and exports the public
      # corpus, builds the sample, runs it, and rewrites the manifest.
      - name: Build the sandbox and both corpora
        id: build
        run: python3 corpus/build.py

      # Saved as soon as the build has downloaded and checked both, even if a later step fails.
      - name: Save the sample backups
        if: always() && steps.backups.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: corpus/public/.cache
          key: ${{ steps.backups.outputs.cache-primary-key }}

      - name: The manifest is byte-identical
        run: |
          python3 -c "import json; n = len(json.load(open('corpus/manifest.json', encoding='utf-8'))['artefacts']); print(n, 'artefacts'); assert n == 133, n"
          git diff --exit-code -- corpus/manifest.json corpus/public/backups.json

      # Lint (pyflakes), types (pyright) and tests (pytest), in the toolbox, against the
      # SQL Server and Postgres the build started.
      - name: Engine checks
        run: sh sandbox/engine-tests.sh
